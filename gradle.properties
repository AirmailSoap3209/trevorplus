# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
# Semantic versioning (https://semver.org), bumped from the last PUBLISHED release:
#   MAJOR - something stops working the old way (a removed feature, setting or command)
#   MINOR - new features, old settings and commands keep working
#   PATCH - fixes only
# Plain MAJOR.MINOR.PATCH, optionally -pre.release (published as a beta). No "+26.2": the Minecraft version is in
# fabric.mod.json and on each upload. The release tag is v<mod_version>. The build refuses anything else.
mod_version=2.4.0
group=com.trevorplus
archives_base_name=trevorplus

# Publishing (./gradlew publishMods). Fill in the project IDs once the Modrinth and CurseForge
# projects exist; the API tokens come from the MODRINTH_TOKEN / CURSEFORGE_TOKEN environment variables.
# Without tokens publishMods only does a dry run into build/publishMods.
modrinth_id=
curseforge_id=1820446
# The part after /minecraft/mc-mods/ in the CurseForge page URL; the in-game update notice links there.
curseforge_slug=trevor-plus-pelts

# Trevor+ Lite (no ESP) is published to its own projects; an empty ID is skipped.
# The lite slug is the part after /minecraft/mc-mods/ in the lite project's URL (empty: link by ID).
modrinth_lite_id=
curseforge_lite_id=
curseforge_lite_slug=

# Dependencies
fabric_api_version=0.161.0+26.2
modmenu_version=20.0.3
