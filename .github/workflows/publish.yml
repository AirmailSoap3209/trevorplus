# Uploads the jar to Modrinth and CurseForge when a GitHub release is published.
# Needs the repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN, and the project IDs
# in gradle.properties (modrinth_id, curseforge_id). See docs/PUBLISHING.md.

name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check publishing setup
        # Without this, a missing project ID or token makes publishMods skip that site and still "succeed".
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          prop() { sed -n "s/^$1=//p" gradle.properties | tr -d '[:space:]'; }
          configured=0
          for site in modrinth curseforge modrinth_lite curseforge_lite; do
            id=$(prop "${site}_id")
            token_var=$(echo "${site%_lite}_TOKEN" | tr '[:lower:]' '[:upper:]')    # lite uses the same token
            token=$(printenv "$token_var" || true)
            if [ -z "$id" ]; then
              echo "::warning::${site}_id is empty in gradle.properties, so nothing will be uploaded to ${site}."
            elif [ -z "$token" ]; then
              echo "::error::${site}_id is set but the ${token_var} repository secret is missing (Settings > Secrets and variables > Actions)."
              exit 1
            else
              echo "${site}: project ${id}, token present."
              configured=$((configured + 1))
            fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "::error::No site is set up to publish to. Fill in modrinth_id and/or curseforge_id in gradle.properties."
            exit 1
          fi
      - name: logic tests
        run: sh tools/run-tests.sh
      - name: build and publish
        run: ./gradlew build publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      - name: attach jars to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
