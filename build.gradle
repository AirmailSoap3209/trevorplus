plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

version = "${project.mod_version}+${project.minecraft_version}"
base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"trevorplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Modrinth + CurseForge upload: ./gradlew publishMods (see docs/PUBLISHING.md)
def modrinthToken = providers.environmentVariable("MODRINTH_TOKEN")
def curseforgeToken = providers.environmentVariable("CURSEFORGE_TOKEN")

publishMods {
	file = tasks.named("jar").flatMap { it.archiveFile }
	additionalFiles.from(tasks.named("sourcesJar").flatMap { it.archiveFile })
	displayName = "Trevor+ ${project.mod_version}"
	version = project.version.toString()
	changelog = providers.fileContents(layout.projectDirectory.file("docs/RELEASE-NOTES.md")).asText
	type = STABLE
	modLoaders.add("fabric")
	dryRun = !(modrinthToken.isPresent() || curseforgeToken.isPresent())

	if (!project.modrinth_id.isEmpty()) {
		modrinth {
			projectId = project.modrinth_id
			accessToken = modrinthToken
			minecraftVersions.add(project.minecraft_version)
			requires("fabric-api")
		}
	}

	if (!project.curseforge_id.isEmpty()) {
		curseforge {
			projectId = project.curseforge_id
			accessToken = curseforgeToken
			minecraftVersions.add(project.minecraft_version)
			javaVersions.add(JavaVersion.VERSION_25)
			clientRequired = true
			serverRequired = false
			requires("fabric-api")
		}
	}
}

test {
	failOnNoDiscoveredTests = false
}