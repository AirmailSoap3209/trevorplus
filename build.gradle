plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

// Semantic versioning, checked here so a bad version can never be built or published (see gradle.properties)
def SEMVER = ~/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$/
if (!(project.mod_version ==~ SEMVER)) {
	throw new GradleException("mod_version '${project.mod_version}' is not semantic versioning: use MAJOR.MINOR.PATCH, "
			+ "optionally with -prerelease (e.g. 2.4.0 or 2.5.0-beta.1), and no +build part")
}
def isPrerelease = project.mod_version.contains("-")
version = project.mod_version
base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"      // Mod Menu
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"trevorplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional at runtime: only ModMenuEntry uses it, and Mod Menu only loads that class when it is installed.
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

// ---- two variants from one codebase ------------------------------------------------------------
// Trevor+ (full) and Trevor+ Lite (no ESP: no mob box, glow, direction line or see-through blocks).
// Each gets a generated BuildFlags class; the ESP code sits in `if (BuildFlags.ESP)` blocks, which
// javac leaves out of the lite bytecode entirely because the flag is a compile-time constant.

abstract class GenerateBuildFlags extends DefaultTask {
	@Input abstract Property<Boolean> getEsp()
	@Input abstract Property<Boolean> getAutomation()
	@Input abstract Property<String> getModId()
	@Input abstract Property<String> getModName()
	@OutputDirectory abstract DirectoryProperty getOutputDir()

	@TaskAction
	void generate() {
		def f = outputDir.file("com/trevorplus/client/BuildFlags.java").get().asFile
		f.parentFile.mkdirs()
		f.text = """package com.trevorplus.client;

/** Generated by the build (GenerateBuildFlags); do not edit. */
final class BuildFlags {
    private BuildFlags() {}

    /** False in Trevor+ Lite: every ESP feature is compiled out. */
    static final boolean ESP = ${esp.get()};
    /** False in Trevor+ Lite: no Automatic accept mode (it would send a command without the player acting). */
    static final boolean AUTOMATION = ${automation.get()};
    static final String MOD_ID = "${modId.get()}";
    static final String NAME = "${modName.get()}";
}
"""
	}
}

def fullFlags = tasks.register("generateBuildFlags", GenerateBuildFlags) {
	esp = true
	automation = true
	modId = "trevorplus"
	modName = "Trevor+"
	outputDir = layout.buildDirectory.dir("generated/flags/full")
}
def liteFlags = tasks.register("generateLiteBuildFlags", GenerateBuildFlags) {
	esp = false
	automation = false
	modId = "trevorplus-lite"
	modName = "Trevor+ Lite"
	outputDir = layout.buildDirectory.dir("generated/flags/lite")
}
sourceSets.client.java.srcDir(fullFlags)

def modProps = { boolean lite ->
	[
		version        : project.version.toString(),
		mod_id         : lite ? "trevorplus-lite" : "trevorplus",
		mod_name       : lite ? "Trevor+ Lite" : "Trevor+",
		other_id       : lite ? "trevorplus" : "trevorplus-lite",
		mod_description: lite
			? "Trapper pelt-grinding companion for Hypixel SkyBlock, without ESP. Quest timer and pelts/hour, Theodolite block highlight (visible blocks only), rarity alerts, Shuriken reminder, zone and cooldown tracking, and a movable HUD with a built-in settings menu. Client-side only."
			: "Trapper pelt-grinding companion for Hypixel SkyBlock. Quest timer and pelts/hour, mob finder with an on-screen box, Theodolite block highlight, rarity alerts, zone and cooldown tracking, and a movable HUD with a built-in settings menu. Client-side only.",
		curseforge_id  : lite ? project.curseforge_lite_id : project.curseforge_id,
		curseforge_slug: lite ? project.curseforge_lite_slug : project.curseforge_slug,
		// only Lite is on Modrinth (no cheats allowed there); its update check uses Modrinth when this is set
		modrinth_id    : lite ? project.modrinth_lite_id : "",
	]
}

processResources {
	def props = modProps(false)
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

def processLiteResources = tasks.register("processLiteResources", Copy) {
	def props = modProps(true)
	inputs.properties props
	from(sourceSets.main.resources.srcDirs)
	from(sourceSets.client.resources.srcDirs)
	filesMatching("fabric.mod.json") {
		expand props
	}
	into(layout.buildDirectory.dir("resources/lite"))
}

def compileLiteClientJava = tasks.register("compileLiteClientJava", JavaCompile) {
	source(fileTree("src/client/java"))
	source(liteFlags)
	classpath = sourceSets.client.compileClasspath
	destinationDirectory = layout.buildDirectory.dir("classes/java/liteClient")
	options.release = 25
}

def liteJar = tasks.register("liteJar", Jar) {
	group = "build"
	description = "Builds Trevor+ Lite (no ESP features)."
	archiveBaseName = "trevorplus-lite"
	from(sourceSets.main.output.classesDirs)
	from(compileLiteClientJava)
	from(processLiteResources)
	from("LICENSE") {
		rename { "${it}_trevorplus-lite" }
	}
}
tasks.named("assemble") { dependsOn(liteJar) }

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Modrinth + CurseForge upload: ./gradlew publishMods (see docs/PUBLISHING.md)
def modrinthToken = providers.environmentVariable("MODRINTH_TOKEN")
def curseforgeToken = providers.environmentVariable("CURSEFORGE_TOKEN")

publishMods {
	file = tasks.named("jar").flatMap { it.archiveFile }
	additionalFiles.from(tasks.named("sourcesJar").flatMap { it.archiveFile })
	displayName = "Trevor+ ${project.mod_version}"
	version = project.version.toString()
	changelog = providers.fileContents(layout.projectDirectory.file("docs/RELEASE-NOTES.md")).asText
	type = isPrerelease ? BETA : STABLE      // 2.5.0-beta.1 goes out as a beta, never as the latest release
	modLoaders.add("fabric")
	dryRun = !(modrinthToken.isPresent() || curseforgeToken.isPresent())

	// the lite variant goes to its own projects, same version and changelog
	def liteFile = liteJar.flatMap { it.archiveFile }
	def liteName = "Trevor+ Lite ${project.mod_version}"

	// Trevor+ (full) is never published to Modrinth: Modrinth does not allow ESP features. Only Lite goes there.
	if (!project.modrinth_lite_id.isEmpty()) {
		modrinth("modrinthLite") {
			projectId = project.modrinth_lite_id
			accessToken = modrinthToken
			file = liteFile
			additionalFiles.setFrom()
			displayName = liteName
			minecraftVersions.add(project.minecraft_version)
			requires("fabric-api")
			optional("modmenu")
		}
	}

	if (!project.curseforge_id.isEmpty()) {
		curseforge {
			projectId = project.curseforge_id
			accessToken = curseforgeToken
			minecraftVersions.add(project.minecraft_version)
			javaVersions.add(JavaVersion.VERSION_25)
			clientRequired = true
			serverRequired = false
			requires("fabric-api")
			optional("modmenu")
		}
	}
	if (!project.curseforge_lite_id.isEmpty()) {
		curseforge("curseforgeLite") {
			projectId = project.curseforge_lite_id
			accessToken = curseforgeToken
			file = liteFile
			additionalFiles.setFrom()
			displayName = liteName
			minecraftVersions.add(project.minecraft_version)
			javaVersions.add(JavaVersion.VERSION_25)
			clientRequired = true
			serverRequired = false
			requires("fabric-api")
			optional("modmenu")
		}
	}
}

test {
	failOnNoDiscoveredTests = false
}
